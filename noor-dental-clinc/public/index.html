<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — Noor Dental Clinic</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2F9BE0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Noor Dental">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/theme.js"></script>
</head>
<body class="login" data-page="login">
<div class="bg-fallback"></div>
<video id="bgvideo" autoplay loop muted playsinline preload="auto" poster="/icons/icon-512.png"><source src="/assets/login-bg.mp4" type="video/mp4"></video>
<div class="login-shade"></div>
<canvas id="fireworks"></canvas>
<div class="login-card" id="card">
  <div class="center" style="margin-bottom:14px">
    <img src="/icons/logo.png" alt="Noor Dental Clinic" style="width:84px;height:84px;border-radius:20px;box-shadow:0 0 30px rgba(47,155,224,.35)">
    <h1 style="margin-top:8px">Noor Dental Clinic</h1>
  </div>
  <div class="center" style="margin-bottom:14px"><div class="clock" id="clock">--:--:--</div><div id="dateEn" style="font-size:.9rem"></div>
    <div id="greet" class="status-pill" style="margin-top:8px;background:#E6F2FD"></div></div>
  <form id="lf" autocomplete="on">
    <label class="f">Username<input id="u" name="username" autocomplete="username" required autofocus></label>
    <label class="f">Password<input id="p" name="password" type="password" autocomplete="current-password" required></label>
    <label class="f" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="rem"> Remember me</label>
    <button class="btn" style="width:100%" type="submit"><span>🔐 Login</span></button>
    <p id="err" class="out center" style="margin-top:10px"></p>
  </form>
  <p class="center muted" style="font-size:.72rem;margin-top:10px">Developed by Muhammad Hasin (Engineer)</p>
</div>
<div id="welcome"><img src="/icons/logo.png" alt="" style="width:110px;border-radius:26px;margin-bottom:12px"><h1 id="wt" style="font-size:2.2rem">Welcome Dr. M. AlNoor Orakzai</h1><h2 id="wc">Noor Dental Clinic</h2><h2 id="wg" style="margin-top:14px"></h2></div>
<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/pages/login.js"></script>
</body>
</html>
