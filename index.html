<script>
/* Safety net against a white screen: if the app files fail to load (old cached copy, bad network) or the page comes back
   empty from the back button, reload once automatically. Runs at most once per browser tab session. */
(function () {
  var K = "saad_recover", errs = [];
  // Remove the ?_r=... marker again so URLs stay clean.
  try { var q = new URL(location.href); if (q.searchParams.has("_r")) { q.searchParams.delete("_r"); history.replaceState(null, "", q.pathname + q.search + q.hash); } } catch (e) {}
  // Self-heal. A browser can hold a BAD copy of a site file (e.g. a "not found" page saved under the CSS file name). Reload alone keeps
  // using that bad copy, so we re-download each site file with cache:"reload" (this overwrites the bad copy in the browser cache,
  // on every browser incl. iPhone Safari), clear the Cache API too, and then reload through a fresh URL. Runs once per tab session.
  function recover() {
    try { if (sessionStorage.getItem(K)) return; sessionStorage.setItem(K, "1"); } catch (e) {}
    var done = false, go = function () { if (done) return; done = true; try { var u = new URL(location.href); u.searchParams.set("_r", Date.now()); location.replace(u.toString()); } catch (e) { location.reload(); } };
    setTimeout(go, 5000);
    try {
      var jobs = [];
      [].forEach.call(document.querySelectorAll('link[rel="stylesheet"][href*="/bundle/"],script[src*="/bundle/"]'), function (n) {
        jobs.push(fetch(n.href || n.src, { cache: "reload", credentials: "same-origin" }).catch(function () {}));
      });
      if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.filter(function (k) { return !/^saad-admin/.test(k); }).map(function (k) { return caches.delete(k); })); }).catch(function () {}));
      Promise.all(jobs).then(go, go);
    } catch (e) { go(); }
  }
  function empty() { var r = document.getElementById("root"); return !r || !r.firstChild; }
  function blank() { if (document.querySelector("[data-ok]")) return false; return !document.body || document.body.innerText.replace(/\s+/g, " ").trim().length < 80; }
  addEventListener("error", function (e) {
    var t = e.target;
    if (t && t !== window && (t.src || t.href)) { if (!/fonts\.(googleapis|gstatic)\.com/.test(t.src || t.href)) errs.push("file failed: " + (t.src || t.href)); }
    else errs.push(String(e.message || "error") + (e.filename ? " @ " + e.filename.split("/").pop() + ":" + e.lineno : ""));
    if (t && (t.tagName === "SCRIPT" || (t.tagName === "LINK" && /\/bundle\//.test(t.href || "")))) recover();
  }, true);
  addEventListener("unhandledrejection", function (e) { errs.push("promise: " + String((e.reason && e.reason.message) || e.reason)); if (empty()) recover(); });
  addEventListener("pageshow", function (e) { if (e.persisted && (empty() || blank())) location.reload(); });
  // If the page is still blank after 4 s, show a visible message with the reason (instead of a silent white screen); it disappears by itself once the site appears.
  var box;
  function panel() {
    if (!blank()) { if (box) { box.remove(); box = null; } return; }
    if (!box) {
      box = document.createElement("div");
      box.setAttribute("style", "position:fixed;inset:0;z-index:2147483647;background:#fff;color:#16181b;font:15px/1.5 system-ui,sans-serif;padding:24px;overflow:auto");
      document.documentElement.appendChild(box);
    }
    box.innerHTML = "<h2 style='margin:0 0 8px'>SAAD CAR RENTAL SERVICES</h2><p>The page is taking too long to load.</p>" +
      "<p><button onclick=\"location.reload()\" style='padding:12px 22px;border-radius:12px;border:0;background:#16181b;color:#fff;font-size:15px'>Reload</button> " +
      "<a href='tel:+923339850599' style='margin-left:12px;color:#16181b'>Call 0333 9850599</a></p>" +
      "<pre style='white-space:pre-wrap;font-size:12px;color:#62666c'>" + (errs.length ? errs.slice(0, 5).join("\n").replace(/</g, "&lt;") : "no error recorded (slow network or blocked file)") + "\nonline: " + navigator.onLine + " | page: " + location.pathname + "</pre>";
  }
  setTimeout(function () { panel(); setInterval(panel, 700); }, 4000);
  setTimeout(function () { if (empty()) recover(); }, 6000);
  addEventListener("load", function () {
    var ls = document.querySelectorAll('link[rel="stylesheet"][href*="/bundle/"]');
    for (var i = 0; i < ls.length; i++) if (!ls[i].sheet) { recover(); return; }
    setTimeout(function () { if (!empty() && !blank()) { try { sessionStorage.removeItem(K); } catch (e) {} } }, 3000); });
})();
